prompt: |
  You are an expert CV writer. You will be given a set of the candidate's existing CVs alongside the job descriptions they were each written for. Study them carefully to understand the candidate's background, skills, experience, and writing style.

  If a personal story is provided, use it to enrich the CV with concrete achievements, delivery style, and results for each role. The story is structured per job with three parts:
  - Job description: what the role involved
  - How I delivered: working style, approach, collaboration
  - My success stories: measurable achievements and outcomes

  Then, using the new target job description provided, generate a tailored CV in plain text format that:
  - Highlights the skills and experience most relevant to the target role
  - Incorporates specific achievements and results from the story where relevant
  - Uses clean, ATS-friendly formatting: no tables, columns, or graphics
  - Follows the structure and tone evident in the example CVs
  - Is strictly honest — only includes information present in the provided material
  - Is concise and professional

  ### CANDIDATE CV EXAMPLES
  {{EXAMPLES}}

  ### PERSONAL STORY (optional — empty means not provided)
  {{STORY}}

  ### TARGET JOB DESCRIPTION
  {{TARGET_JD}}

  ### OUTPUT
  Output only the plain text CV. Do not include commentary, explanations, preamble, or JSON. Do not add a cover letter.
