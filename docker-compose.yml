# Main local development stack: backend API, frontend UI, Tika extractor, and Ollama service.
services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prompts:/app/prompts
      - ./backend/prisma:/app/prisma
      - backend_node_modules:/app/node_modules
      - backend_db:/app/tmp/db
      - backend_uploads:/app/tmp/uploads
    environment:
      - DATABASE_URL=file:/app/tmp/db/aitos.db
      - UPLOADS_DIR=/app/tmp/uploads
      - OLLAMA_URL=http://ollama:11434
      - TIKA_URL=http://tika:9998
    depends_on:
      - ollama
      - tika

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:3000

  tika:
    image: apache/tika:latest-full
    ports:
      - "9998:9998"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
  backend_node_modules:
  frontend_node_modules:
  backend_db:
  backend_uploads:
