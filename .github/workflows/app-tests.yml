name: App Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
      - 'run-tests.sh'
      - '.github/workflows/app-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
      - 'run-tests.sh'
      - '.github/workflows/app-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services and run tests
        run: ./run-tests.sh

      - name: Stop services
        if: always()
        run: docker compose down
