name: CLI Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-cli:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            TAG_NAME="v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        run: ./build-cli-package.sh "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: aitos-cli-${{ steps.version.outputs.version }}
          path: |
            dist/aitos-cli-${{ steps.version.outputs.version }}.tar.gz
            dist/aitos-cli-${{ steps.version.outputs.version }}.sha256
          retention-days: 1

      - name: Publish summary
        run: |
          echo "## CLI release package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tarball: dist/aitos-cli-${{ steps.version.outputs.version }}.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checksum file: dist/aitos-cli-${{ steps.version.outputs.version }}.sha256" >> "$GITHUB_STEP_SUMMARY"

  upload-release-assets:
    if: github.event_name == 'release'
    needs: release-cli
    runs-on: ubuntu-24.04
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: aitos-cli-${{ needs.release-cli.outputs.version }}
          path: dist

      - name: Upload release assets
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de  # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release-cli.outputs.tag_name }}
          file: dist/aitos-cli-${{ needs.release-cli.outputs.version }}.*
          file_glob: true
          overwrite: true
