name: App Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
      - 'run-tests.sh'
      - 'yarn.lock'
      - 'package.json'
      - '.github/workflows/app-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
      - 'run-tests.sh'
      - 'yarn.lock'
      - 'package.json'
      - '.github/workflows/app-tests.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Start services and run tests
        run: ./run-tests.sh

      - name: Stop services
        if: always()
        run: docker compose down
